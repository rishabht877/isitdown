<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Track the public APIs you depend on and note how you work around their problems."
    />
    <meta name="author" content="Dins Patel" />
    <title>Watchlist - IsItDown</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/nav.css" />
    <link rel="stylesheet" href="/css/service-picker.css" />
    <link rel="stylesheet" href="/css/watchlist.css" />
  </head>
  <body>
    <header class="site-nav"></header>

    <main>
      <h1>Watchlist</h1>
      <section class="panel" aria-labelledby="form-heading">
        <h2 id="form-heading">Add a service to the watchlist</h2>
        <form id="watch-form">
          <input type="hidden" id="watch-id" />

          <div class="field">
            <label for="form-service-search">Find a service</label>
            <input
              type="search"
              id="form-service-search"
              placeholder="Search services by name"
              autocomplete="off"
            />
            <label for="form-service">Service</label>
            <select id="form-service" required></select>
          </div>

          <div class="field">
            <label for="status">Status</label>
            <select id="status" required>
              <option value="watching">Watching</option>
              <option value="worked around">Worked around</option>
            </select>
          </div>

          <div class="field">
            <label for="notes">Notes</label>
            <textarea id="notes" rows="4" maxlength="1000"></textarea>
          </div>

          <p id="form-message" class="message" role="status"></p>

          <div class="actions">
            <button type="submit" id="submit-button">Add to watchlist</button>
            <button type="button" id="cancel-button" class="secondary" hidden>
              Cancel edit
            </button>
          </div>
        </form>
      </section>

      <section class="panel" aria-labelledby="list-heading">
        <h2 id="list-heading">Watched services</h2>

        <form id="filters" class="filters">
          <div class="field">
            <label for="filter-service-search">Find a service</label>
            <input
              type="search"
              id="filter-service-search"
              placeholder="Search services by name"
              autocomplete="off"
            />
          </div>
          <div class="field">
            <label for="filter-service">Service</label>
            <select id="filter-service"></select>
          </div>
          <div class="field">
            <label for="filter-status">Status</label>
            <select id="filter-status">
              <option value="">All statuses</option>
              <option value="watching">Watching</option>
              <option value="worked around">Worked around</option>
            </select>
          </div>
        </form>

        <p id="list-message" class="message" role="status"></p>
        <ul id="watch-list" class="watch-list"></ul>

        <nav class="pager" aria-label="Watchlist pages">
          <button type="button" id="prev-button" class="secondary">
            Previous
          </button>
          <p id="page-info"></p>
          <button type="button" id="next-button" class="secondary">Next</button>
        </nav>
      </section>
    </main>

    <script type="module" src="/js/watchlist.js"></script>
  </body>
</html>
